name: "[Flint] Build and Test"

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  build:
    runs-on: ubuntu-latest
    if: ${{ github.event_name != 'push' || !contains(github.event.head_commit.message, 'ci skip') }}

    steps:
      - name: Debug connectivity
        run: |
          echo "=== DNS ==="
          getent ahosts git.kbz8.me || true

          echo "=== IPv4 ==="
          curl -4 -v --connect-timeout 5 \
            --max-time 10 \
            https://git.kbz8.me/ || true

          echo "=== IPv6 ==="
          curl -6 -v --connect-timeout 5 \
            --max-time 10 \
            https://git.kbz8.me/ || true

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: https://codeberg.org/mlugg/setup-zig@v2

      - name: Building [debug]
        run: zig build flint

      - name: Building [release=fast]
        run: zig build flint --release=fast

      - name: Building [release=safe]
        run: zig build flint --release=safe

      - name: Building [release=small]
        run: zig build flint --release=small

      - name: Testing
        run: zig build test-flint
